services:
  postgres:
    image: postgres:16-bullseye
    environment:
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/postgres:/var/lib/postgresql/data
    # puerto del host, lo defino en .env y .env-distr  
    ports:
    - ${DB_PORT}:5432
    networks:
      red:

# agregamos servicio django 
  django:
    image: pwa2026tp2:0.1
    build:
      context: .
      dockerfile: config/django-image/Dockerfile
    
    container_name: pwa2026-django
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/usr/src/app
    environment:
      DJANGO_SU_NAME: ${DJANGO_SU_NAME}
      DJANGO_SU_EMAIL: ${DJANGO_SU_EMAIL}
      DJANGO_SU_PASSWORD: ${DJANGO_SU_PASSWORD}
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - red
    
networks:
  red: