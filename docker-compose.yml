services:
  postgres:
    image: postgres:16-bullseye
    environment:
      
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/postgres:/var/lib/postgresql/data
    # puerto del host, lo defino en .env y .env-distr  
    ports:
    - ${DB_PORT}:5432
    networks:
      red:
    
networks:
  red: