
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script> <!-- incorporamos Vue -->
    <title>Perfil Simple</title>
</head>

<body>  <!--aqui trabajara Vue-->

    <div id="app">  <!--lugar de la aplicacion Vue, Vue controlra el div-->
        <p>Nombre: {{nombre}}</p> <!--interpolacion {{}}, mostramos datos-->
        <p>Eedad: {{edad}}</p>
        <p>Ciudad: {{ciudad}}</p>

        <p>Hol, mi nombre es {{nombre}}, tengo {{edad}} anios y vivo en {{ciudad}}.</p>
        <!--Vue se encrga de reemplazar los {{}} por los datos almacendos en data-->

        <h2>Contador: {{contador}}</h2> <!--interpolacion-->

        <button @click="contador++">Incrementar</button>
        <button @click="contador--">Decrementar</button>

    </div>
    <script> //datos a declarar con objeto "data de Vue"
        const app= new Vue({
            el: `#app`,
            data: {
                nombre: `Ana Garcia`,
                edad: 30,
                ciudad: `Tupungato`,
                contador: 0
            }
        })

    </script>

</body>
</html>
